<!DOCTYPE html>
<html>
<head>
  <title>Generate DKINGs AI Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: white; }
    canvas { margin: 10px; border: 1px solid #333; }
    button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <h1>DKINGs AI - PWA Icon Generator</h1>
  <p>Click "Generate All" to create all required PWA icon sizes, then right-click each to save.</p>
  <button onclick="generateAll()">Generate All Icons</button>
  <div id="icons"></div>
  <script>
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    const container = document.getElementById('icons');

    function drawIcon(canvas, size) {
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = gradient;

      // Rounded rectangle
      const r = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Text "DK"
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.4}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('DK', size / 2, size / 2);
    }

    function generateAll() {
      container.innerHTML = '';
      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        drawIcon(canvas, size);
        const label = document.createElement('p');
        label.textContent = `${size}x${size}`;
        container.appendChild(label);
        container.appendChild(canvas);

        // Auto download
        const link = document.createElement('a');
        link.download = `icon-${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Auto-generate on load
    generateAll();
  </script>
</body>
</html>
